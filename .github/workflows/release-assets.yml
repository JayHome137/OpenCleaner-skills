name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-and-attest:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify release version
        id: metadata
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate package
        run: python3 scripts/validate_package.py

      - name: Run dependency-free security guard
        run: python3 scripts/security_scan.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Run macOS smoke test
        run: python3 tests/macos_smoke.py

      - name: Build source archive and checksums
        shell: bash
        run: |
          version="${{ steps.metadata.outputs.version }}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="OpenCleaner-${version}/" \
            --output="dist/OpenCleaner-${version}.tar.gz" \
            "${GITHUB_SHA}"
          cd dist
          shasum -a 256 "OpenCleaner-${version}.tar.gz" > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/OpenCleaner-${{ steps.metadata.outputs.version }}.tar.gz
            dist/SHA256SUMS

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: OpenCleaner-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
