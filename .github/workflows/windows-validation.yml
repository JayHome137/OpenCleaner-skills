name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate package metadata
        shell: pwsh
        run: python scripts/validate_package.py

      - name: Run Windows smoke test
        shell: pwsh
        run: python tests/windows_smoke.py
