name: macOS validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate package
        run: python3 scripts/validate_package.py

      - name: Run dependency-free security guard
        run: python3 scripts/security_scan.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run macOS end-to-end smoke test
        run: python3 tests/macos_smoke.py
