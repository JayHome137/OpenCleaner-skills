<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>存储分析报告</title>
<style>
  :root {
    --page: #f4f6f8;
    --surface: #ffffff;
    --text: #20242b;
    --muted: #667085;
    --border: #dfe3e8;
    --blue: #1769e0;
    --blue-soft: #eaf2ff;
    --green: #14883b;
    --green-soft: #e9f8ee;
    --amber: #b95e00;
    --amber-soft: #fff4df;
    --yellow-soft: #fff4df;
    --red: #c93636;
    --red-soft: #fff0ee;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .05);
  }

  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    padding: 28px 18px 72px;
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; letter-spacing: 0; }
  .report-shell { width: min(1040px, 100%); margin: 0 auto; }
  .report-head { margin-bottom: 22px; }
  .report-head h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .report-meta { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .block { margin-bottom: 26px; }
  .block-title {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    margin: 0 0 12px;
    font-size: 18px;
    line-height: 1.35;
  }
  .block-count { color: var(--muted); font-size: 12px; font-weight: 500; }
  .block-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; margin-left: auto; }
  .section-toggle { min-height: 32px; padding: 5px 10px; }
  .workspace-tools { display: grid; gap: 12px; padding: 16px; }
  .workspace-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .workspace-toolbar input, .workspace-toolbar select {
    min-height: 34px; min-width: 0; padding: 6px 9px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; color: var(--text); font: inherit;
  }
  .workspace-toolbar .path-input { flex: 1 1 320px; }
  .root-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .root-tab { max-width: 100%; overflow-wrap: anywhere; }
  .browser-path { padding: 8px 10px; border-radius: 6px; background: #f7f8fa; font: 12px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }
  .browser-list { display: grid; gap: 5px; }
  .browser-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto auto; gap: 9px; align-items: center; min-height: 42px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .browser-row:last-child { border-bottom: 0; }
  .browser-name { min-width: 0; border: 0; padding: 0; background: transparent; color: var(--text); cursor: pointer; text-align: left; overflow-wrap: anywhere; }
  .browser-name:disabled { cursor: default; }
  .browser-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .settings-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .settings-panel { min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
  .settings-panel h3 { margin: 0 0 8px; font-size: 14px; }
  .settings-list { display: grid; gap: 6px; }
  .settings-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .settings-item span { min-width: 0; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace; }
  .installer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .installer-item { padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .installer-item h3 { margin: 0 0 6px; font-size: 14px; overflow-wrap: anywhere; }
  .installer-item dl { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 8px; margin: 0; font-size: 12px; }
  .installer-item dt { color: var(--muted); }
  .installer-item dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }

  .surface {
    background: var(--surface);
    border: 1px solid rgba(223, 227, 232, .8);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .overview { padding: 22px; }
  .overview-lead { margin: 0 0 14px; }
  .metric-grid { display: flex; flex-wrap: wrap; gap: 18px 30px; }
  .metric { min-width: 104px; }
  .metric-label { color: var(--muted); font-size: 12px; }
  .metric-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .capacity-label { margin: 15px 0 4px; color: var(--muted); font-size: 12px; }
  .capacity-track {
    display: flex;
    width: 100%;
    height: 14px;
    margin: 4px 0 10px;
    overflow: hidden;
    background: #edf0f3;
    border-radius: 7px;
  }
  .capacity-track span { display: block; height: 100%; min-width: 0; }
  .capacity-track span + span { border-left: 1px solid #fff; }
  .seg-green { background: var(--green); }
  .seg-amber { background: #e27a15; }
  .seg-red { background: var(--red); }
  .seg-blue { background: var(--blue); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fafbfc;
    font-size: 12px;
    font-weight: 600;
  }
  .level-dot { width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; }
  .level-dot.green { background: var(--green); }
  .level-dot.yellow { background: #e27a15; }
  .level-dot.red { background: var(--red); }
  .level-dot.blue { background: var(--blue); }
  .disk-list { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .disk-list-title { margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .disk-row { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; margin: 7px 0; }
  .disk-name { font-weight: 700; }
  .disk-track { height: 9px; overflow: hidden; background: #edf0f3; border-radius: 5px; }
  .disk-track span { display: block; height: 100%; background: var(--blue); }
  .disk-value { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .system-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 8px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .system-grid > div { min-width: 0; overflow-wrap: anywhere; }
  .system-grid b { color: var(--muted); font-weight: 500; }
  .decision-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; }
  .decision-column { min-width: 0; padding: 18px; background: var(--surface); }
  .decision-column h3 { margin: 0 0 10px; font-size: 14px; }
  .decision-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #edf0f3; }
  .decision-row:last-child { border-bottom: 0; }
  .decision-row span { min-width: 0; color: var(--muted); overflow-wrap: anywhere; }
  .decision-row b { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .owner-list { overflow: hidden; }
  .owner-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .owner-row:last-child { border-bottom: 0; }
  .owner-main { min-width: 0; }
  .owner-main b, .owner-main span { display: block; overflow-wrap: anywhere; }
  .owner-main span { color: var(--muted); font-size: 12px; }
  .owner-size { color: var(--blue); font-weight: 700; white-space: nowrap; }
  .owner-policy { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .coverage-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .coverage-panel { min-width: 0; }
  .coverage-panel h3 { margin: 0 0 6px; font-size: 14px; }
  .coverage-panel p { margin: 4px 0; color: var(--muted); }
  .full-details { margin-bottom: 26px; }
  .full-details > summary { min-height: 42px; padding: 10px 14px; cursor: pointer; font-size: 16px; font-weight: 700; }
  .full-details-content { padding: 14px 14px 1px; border-top: 1px solid var(--border); }
  .evidence-list { margin: 4px 0 0; padding-left: 20px; }

  .table-frame { width: 100%; min-width: 0; max-width: 100%; overflow: auto; contain: inline-size; clip-path: inset(0); }
  table { width: 100%; min-width: 730px; border-collapse: collapse; }
  th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
  th { color: var(--muted); background: #fafbfc; font-size: 12px; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.numeric { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.mono, .path-line { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  td.mono { color: var(--muted); font-size: 12px; word-break: break-all; }

  .guidance { padding: 20px 22px; }
  .guidance p { margin: 0 0 10px; }
  .guidance ul { margin: 0; padding-left: 20px; }
  .guidance li { margin: 3px 0; }
  .finding {
    margin-bottom: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-left-width: 4px;
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .finding.green { border-left-color: var(--green); }
  .finding.yellow { border-left-color: #e27a15; }
  .finding.red { border-left-color: var(--red); }
  .finding-toggle {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto 16px;
    gap: 11px;
    align-items: center;
    width: 100%;
    min-height: 55px;
    padding: 13px 16px;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    text-align: left;
  }
  .finding-toggle:hover { background: #fafbfc; }
  .finding-primary { display: grid; min-width: 0; gap: 3px; }
  .finding-title-row { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 6px 9px; }
  .finding-name { min-width: 0; overflow-wrap: anywhere; font-size: 15px; font-weight: 700; }
  .finding-path-preview { min-width: 0; color: var(--muted); font: 11px/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }
  .finding-status {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .finding-status.can-trash { background: var(--green-soft); color: var(--green); }
  .finding-status.needs-review { background: var(--amber-soft); color: var(--amber); }
  .finding-status.blocked { background: var(--red-soft); color: var(--red); }
  .finding-size { color: var(--blue); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .finding-arrow { color: var(--muted); transition: transform .18s ease; }
  .finding.expanded .finding-arrow { transform: rotate(90deg); }
  .finding-body { display: none; padding: 0 16px 17px 37px; }
  .finding.expanded .finding-body { display: block; }
  .path-line {
    margin-bottom: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #f7f8fa;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .detail { margin: 10px 0; }
  .detail-title { margin-bottom: 2px; color: var(--muted); font-size: 12px; font-weight: 700; }
  .disposal-verdict {
    display: grid;
    grid-template-columns: minmax(112px, auto) minmax(0, 1fr);
    gap: 6px 12px;
    margin: 0 0 12px;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
  }
  .disposal-verdict.can-trash { background: var(--green-soft); color: #0c642b; }
  .disposal-verdict.needs-review { background: var(--amber-soft); color: #7a4300; }
  .disposal-verdict.blocked { background: var(--red-soft); color: #942929; }
  .disposal-verdict span { min-width: 0; overflow-wrap: anywhere; }
  .tag {
    display: inline-block;
    margin: 2px 5px 2px 0;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--blue-soft);
    color: var(--blue);
    font-size: 12px;
  }
  .risk-note { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--red-soft); color: var(--red); font-size: 12px; }
  .command { position: relative; margin: 6px 0; padding: 12px 76px 12px 12px; overflow-x: auto; border-radius: 6px; background: #24282f; color: #f0f2f5; font: 12px/1.65 ui-monospace, "SFMono-Regular", Consolas, monospace; white-space: pre; }
  .copy-command { position: absolute; top: 7px; right: 7px; padding: 3px 9px; border: 0; border-radius: 5px; background: #3a4049; color: #fff; cursor: pointer; font-size: 11px; }
  .copy-command.copied { background: var(--green); }

  .action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .action-button { min-height: 34px; padding: 6px 12px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-weight: 650; }
  .action-button.trash { border-color: #b9dfc5; background: var(--green-soft); color: var(--green); }
  .action-button.reviewed_trash { border-color: #e5b954; background: var(--amber-soft); color: var(--amber); }
  .action-button.open { background: #eef0f3; color: var(--text); }
  .action-button.primary { background: var(--blue); color: #fff; }
  .action-button.secondary { border-color: var(--border); background: #fff; color: var(--text); }
  .action-button:hover { filter: brightness(.97); }
  .action-button:disabled { cursor: default; opacity: .5; }
  .action-state { min-width: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .runtime-state { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .runtime-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--muted); }
  .runtime-state.inactive .runtime-dot { background: var(--green); }
  .runtime-state.active .runtime-dot, .runtime-state.unknown .runtime-dot { background: var(--red); }
  .action-state.ok { color: var(--green); font-weight: 700; }
  .action-state.error { color: var(--red); }
  .action-help { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .finding.completed { opacity: .72; }
  .finding.completed .finding-name { text-decoration: line-through; }
  .permission-note { padding: 12px 14px; border: 1px solid #f0c36d; border-radius: 8px; background: var(--amber-soft); color: #7a4300; overflow-wrap: anywhere; }
  .history-list { display: grid; gap: 8px; }
  .history-entry { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fafbfc; }
  .history-entry.ok { border-left: 3px solid var(--green); }
  .history-entry.error { border-left: 3px solid var(--red); }
  .history-meta { color: var(--muted); font-size: 12px; }
  .history-path { margin-top: 3px; font: 12px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }
  .session-bar { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; padding: 10px 12px; }
  .session-copy { min-width: 0; flex: 1; }
  .session-title { font-weight: 700; }
  .session-detail { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .select-row { display: flex; align-items: flex-start; gap: 9px; margin: 10px 0 0; }
  .select-row input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--blue); }
  .select-row label { cursor: pointer; font-weight: 650; }
  .batch-bar {
    position: fixed;
    right: 18px;
    bottom: 18px;
    left: 18px;
    z-index: 20;
    display: none;
    width: min(760px, calc(100% - 36px));
    min-height: 58px;
    margin: 0 auto;
    padding: 10px 12px;
    align-items: center;
    gap: 12px;
    border: 1px solid #cfd6df;
    border-radius: 8px;
    background: rgba(255, 255, 255, .98);
    box-shadow: 0 12px 36px rgba(16, 24, 40, .2);
  }
  .batch-bar.visible { display: flex; }
  .batch-summary { min-width: 0; flex: 1; }
  .batch-summary b { display: block; }
  .batch-summary span { color: var(--muted); font-size: 12px; }
  .batch-actions { display: flex; gap: 8px; }
  dialog {
    width: min(620px, calc(100% - 28px));
    max-height: min(760px, calc(100vh - 40px));
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 24px 64px rgba(16, 24, 40, .26);
  }
  dialog::backdrop { background: rgba(22, 27, 34, .48); }
  .confirm-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
  .confirm-head h2 { margin: 0; font-size: 18px; }
  .confirm-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .confirm-body { max-height: 480px; padding: 14px 20px; overflow-y: auto; }
  .confirm-list { display: grid; gap: 7px; margin: 10px 0 0; }
  .confirm-item { padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fafbfc; }
  .confirm-item b { display: block; overflow-wrap: anywhere; }
  .confirm-item span { display: block; color: var(--muted); font: 11px/1.45 ui-monospace, "SFMono-Regular", Consolas, monospace; overflow-wrap: anywhere; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--border); }
  .batch-progress { margin-top: 12px; color: var(--muted); font-size: 12px; }
  .batch-progress.error { color: var(--red); }
  .review-ack { display: none; align-items: flex-start; gap: 9px; margin-top: 14px; padding: 10px; border: 1px solid #e5b954; border-radius: 6px; background: var(--yellow-soft); }
  .review-ack.visible { display: flex; }
  .review-ack input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--amber); }
  footer { margin-top: 36px; color: var(--muted); text-align: center; font-size: 12px; }

  @media (max-width: 640px) {
    body { padding: 20px 12px 56px; }
    .report-head h1 { font-size: 23px; }
    .overview, .guidance { padding: 17px; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .metric { min-width: 0; }
    .metric-value { font-size: 16px; overflow-wrap: anywhere; }
    .system-grid { grid-template-columns: 1fr; }
    .decision-grid, .coverage-grid { grid-template-columns: 1fr; }
    .owner-row { grid-template-columns: minmax(0, 1fr) auto; }
    table { min-width: 0; table-layout: fixed; }
    th:nth-child(1), td:nth-child(1) { width: 34px; }
    th:nth-child(2), td:nth-child(2) { width: 34px; }
    th:nth-child(3), td:nth-child(3) { width: 82px; }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(6), td:nth-child(6),
    th:nth-child(7), td:nth-child(7) { display: none; }
    td:nth-child(5) b { overflow-wrap: anywhere; }
    .block-title { align-items: flex-start; flex-wrap: wrap; font-size: 17px; }
    .block-tools { width: 100%; margin-left: 0; justify-content: flex-start; }
    .finding-toggle { grid-template-columns: 10px minmax(0, 1fr) 16px; }
    .finding-size { grid-column: 2; grid-row: 2; white-space: normal; }
    .finding-arrow { grid-column: 3; grid-row: 1 / span 2; }
    .finding-body { padding-left: 16px; }
    .disposal-verdict { grid-template-columns: 1fr; }
    .disk-row { grid-template-columns: 44px 1fr; }
    .disk-value { grid-column: 2; }
    .session-bar, .batch-bar { align-items: stretch; flex-direction: column; }
    .session-bar .action-button, .batch-actions, .batch-actions .action-button { width: 100%; }
    .batch-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .settings-columns { grid-template-columns: 1fr; }
    .browser-row { grid-template-columns: 24px minmax(0, 1fr) auto; }
    .browser-row .browser-modified { display: none; }
  }
</style>
</head>
<body>
<main class="report-shell">
  <header class="report-head">
    <h1>存储分析报告</h1>
    <div class="report-meta" id="report-meta"></div>
  </header>
  <div id="report-content"></div>
  <footer>open-cleaner · 扫描只读 · 文件操作需策略授权和确认</footer>
</main>

<script>
"use strict";
const REPORT = __REPORT_DATA__;
const DECISION = __DECISION_DATA__;
const SESSION = __DELETE_CONFIG__;

const h = value => String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
})[char]);
const compactSize = value => String(value == null ? "" : value)
  .replace(/[（(]\s*估算[^）)]*[）)]/g, "").trim();
const managerName = /win/i.test(String(REPORT.system && REPORT.system.os || "")) ? "资源管理器" : "访达";

function sizeInGb(value) {
  const match = String(value || "").match(/([\d.]+)\s*(TB|GB|MB)?/i);
  if (!match) return 0;
  let amount = Number(match[1]);
  const unit = (match[2] || "GB").toUpperCase();
  if (unit === "TB") amount *= 1024;
  if (unit === "MB") amount /= 1024;
  return Number.isFinite(amount) ? amount : 0;
}

function bytesLabel(value) {
  const amount = Number(value || 0);
  const sign = amount < 0 ? "-" : "+";
  let size = Math.abs(amount);
  const units = ["B", "KB", "MB", "GB", "TB"];
  let unit = 0;
  while (size >= 1024 && unit < units.length - 1) { size /= 1024; unit += 1; }
  const digits = unit === 0 ? 0 : 1;
  return `${sign}${size.toFixed(digits)} ${units[unit]}`;
}

function bytesPlain(value) {
  return bytesLabel(Math.max(0, Number(value || 0))).replace(/^\+/, "");
}

function decisionRow(label, bucket) {
  const value = bucket || {count: 0, size_bytes: 0};
  return `<div class="decision-row"><span>${h(label)} · ${h(value.count || 0)} 项</span><b>${h(bytesPlain(value.size_bytes))}</b></div>`;
}

function actionIndex() {
  const index = new Map();
  for (const action of (SESSION && SESSION.actions || [])) {
    const key = `${action.mode}\n${action.path}`;
    const group = index.get(key) || [];
    group.push(action.action_id);
    index.set(key, group);
  }
  return index;
}
const ACTION_INDEX = actionIndex();
const ACTIONS = new Map((SESSION && SESSION.actions || []).map(action => [action.action_id, action]));
const SELECTED = new Set();
let PENDING_ACTIONS = [];
let LOCAL_SETTINGS = null;
let BROWSER_STATE = {path: "", selected: new Set()};

function idsFor(paths, mode) {
  const ids = [];
  for (const path of (paths || [])) ids.push(...(ACTION_INDEX.get(`${mode}\n${path}`) || []));
  return [...new Set(ids)];
}

function reportItemForAction(action) {
  const items = [...(REPORT.green || []), ...(REPORT.yellow || []), ...(REPORT.red || [])];
  return items.find(item => item.path === action.path || (item.trash_paths || []).includes(action.path) || (item.reviewed_trash_paths || []).includes(action.path)) || {};
}

function runtimeForItem(item) {
  if (!SESSION) return item.runtime || null;
  const pathSet = new Set([item.path, ...(item.trash_paths || []), ...(item.reviewed_trash_paths || [])]);
  const action = (SESSION.actions || []).find(candidate => pathSet.has(candidate.path) && candidate.runtime);
  if (action) return action.runtime;
  const rejected = (SESSION.rejected || []).find(candidate =>
    pathSet.has(candidate.path) && ["owner_active", "runtime_unknown"].includes(candidate.code)
  );
  if (rejected && item.runtime) {
    return {...item.runtime, state: rejected.code === "owner_active" ? "active" : "unknown"};
  }
  return item.runtime || null;
}

function runtimePanel(item) {
  const runtime = runtimeForItem(item);

async function getJson(endpoint) {
  const response = await fetch(endpoint, {headers: {"X-OpenCleaner-Token": SESSION.token}});
  let result = {};
  try { result = await response.json(); } catch (_error) { result = {}; }
  if (!response.ok || !result.ok) throw new Error(result.error || `请求失败（${response.status}）`);
  return result;
}

function settingsItem(value, kind, removable = true) {

async function browsePath(path) {
  const query = new URLSearchParams({
    path,
    search: document.getElementById("browser-search").value,
    sort: document.getElementById("browser-sort").value,
    min_size_bytes: document.getElementById("browser-min-size").value
  });
  const state = document.getElementById("workspace-state");
  state.textContent = "正在读取目录…";
  try {
    const result = await getJson(`${SESSION.browse_endpoint}?${query}`);
    renderBrowser(result);
    state.textContent = "只读浏览，不会授予删除权限";
    state.className = "action-state ok";
  } catch (error) {
    state.textContent = `读取失败：${error && error.message ? error.message : error}`;
    state.className = "action-state error";
  }
}

  const button = document.getElementById("protect-selected");

function segments(system, summary) {
  const total = sizeInGb(system.disk_total) || 1;
  const used = sizeInGb(system.disk_used);
  const stats = summary && summary.tier_stats || {};
  const values = [
    ["green", sizeInGb(stats.green), "绿色 · 可删除候选"],
    ["amber", sizeInGb(stats.yellow), "橙色 · 人工决定"],
    ["red", sizeInGb(stats.red), "红色 · 不能直接删除"]
  ];
  const known = values.reduce((sum, item) => sum + item[1], 0);
  values.push(["blue", Math.max(0, used - known), "系统及其他"]);
  return values.map(([tone, value, label]) => value > 0
    ? `<span class="seg-${tone}" style="width:${Math.min(100, value / total * 100).toFixed(2)}%" title="${h(label)}：约 ${value.toFixed(1)} GB"></span>`
    : "").join("");
}

  const disks = system.disks || [];

  const diskRows = otherDisks.map(disk => {

    return `<div class="disk-row"><span class="disk-name">${h(disk.name)}</span><div class="disk-track"><span style="width:${percent.toFixed(1)}%"></span></div><span class="disk-value">${h(disk.used)} / ${h(disk.total)}</span></div>`;
  }).join("");
  const coverageText = coverage.requested_roots == null ? "未提供" : `${h(coverage.completed_roots)} / ${h(coverage.requested_roots)} 个根目录`;
  const legend = [["green", "绿色 · 可删除候选", stats.green], ["yellow", "橙色 · 人工决定", stats.yellow], ["red", "红色 · 不能直接删除", stats.red]]
    .map(([tone, label, value]) => `<span class="legend-chip"><span class="level-dot ${tone}"></span>${label} <b>${h(compactSize(value || "约 0 GB"))}</b></span>`).join("");
  return `<section class="block surface overview">

function mutationDecision(item, mode) {
  const paths = mode === "trash" ? (item.trash_paths || []) : (item.reviewed_trash_paths || []);
  const authorized = DECISION && DECISION.authorized || [];
  const rejected = DECISION && DECISION.rejected_items || [];
  const allowed = authorized.find(action => action.mode === mode && paths.includes(action.path));
  const blocked = rejected.find(action => action.mode === mode && paths.includes(action.path));
  return {allowed, blocked};
}

function disposition(item, tier) {
  if (tier === "green") {
    const state = mutationDecision(item, "trash");
    if (state.blocked) return {
      tone: "blocked", short: "当前被阻止", title: "实时重验未通过",
      explanation: state.blocked.message || "当前状态不满足安全处置条件。"
    };
    if (!state.allowed) return {
      tone: "needs-review", short: "等待实时重验", title: "只是规则候选",
      explanation: "分类规则认为目标可恢复，但尚无当前 action plan 授权，不能据此直接处理。"
    };
    return {
      tone: "can-trash",
      short: "可移入废纸篓",
      title: "可以处理",
      explanation: "此项目命中确定性可恢复规则，可以移入废纸篓；清空废纸篓后才会实际释放空间。"
    };
  }
  if (tier === "yellow" && item.reviewed_trash_paths && item.reviewed_trash_paths.length) {
    const state = mutationDecision(item, "reviewed_trash");
    if (state.blocked) return {
      tone: "blocked", short: "当前被阻止", title: "人工复核入口已禁用",
      explanation: state.blocked.message || "当前状态不满足受限人工复核条件。"
    };
    if (!state.allowed) return {
      tone: "needs-review", short: "等待实时重验", title: "尚未授权人工复核",
      explanation: "这是受限复核候选；只有当前 action plan 通过实时检查后才会出现复核入口。"
    };
    return {
      tone: "needs-review",
      short: "需人工复核",
      title: "人工复核后可以处理",
      explanation: "此项目包含受限处置路径，但必须逐项确认不是唯一副本、活动项目或应用核心数据，再移入废纸篓。"
    };
  }
  if (tier === "yellow") {
    const tool = item.runtime && item.runtime.owner_tool;
    return {
      tone: "blocked",
      short: tool ? "仅由所有者管理" : "当前不建议删除",
      title: tool ? "不提供直接删除入口" : "当前不建议删除",
      explanation: tool
        ? "此目标由应用或开发工具管理。OpenCleaner 只展示原因和建议命令，不会执行命令，也不会开放删除入口。"
        : "没有确定性规则或受限复核授权证明整个项目可安全处置；请按下方建议在所属应用或访达中核对。"
    };
  }
  return {
    tone: "blocked",
    short: "不可直接处理",
    title: "不能由 OpenCleaner 直接处理",
    explanation: "这是应用本体或受系统管理的内容；OpenCleaner 仅提供定位与正规卸载建议。"
  };
}

function ownerName(item, tier) {
  const evidenceOwner = item.evidence && item.evidence.owner;
  if (evidenceOwner && evidenceOwner !== "未识别") return evidenceOwner;
  const runtimeOwner = item.runtime && item.runtime.owner_tool && item.runtime.owner_tool.name;
  if (runtimeOwner) return runtimeOwner;
  if (tier === "red" && String(item.path || "").toLowerCase().endsWith(".app")) return item.name || "未命名应用";
  const identifier = String(item.path || "").match(/\/Library\/(?:Group )?(?:Containers|Caches)\/([^/]+)/i);
  if (identifier) return `未识别显示名称（目录标识：${identifier[1]}）`;
  return "未识别到明确归属应用";
}

function purposeText(item, tier) {
  if (tier === "green") return item.rule_reason || "可再生缓存或临时内容。";
  if (tier === "yellow") return item.content_profile || "需要查看实际内容后判断。";
  return item.why_keep || "应用本体或受系统管理的内容。";
}

function decisionBasis(item, tier) {
  if (tier === "green") return item.rule_id ? `确定性授权规则 ${item.rule_id}` : "确定性可恢复规则";
  if (tier === "yellow") return item.why_manual || "没有确定性规则证明整个目标可再生。";
  return item.why_keep || "应用本体不属于自动处置范围。";
}

function evidencePanel(item) {
  const evidence = item.evidence;
  if (!evidence) return "";
  const confidence = {high: "高", medium: "中", low: "低"}[evidence.confidence] || "未知";
  const sources = (evidence.sources || []).map(value => `<li>${h(value)}</li>`).join("");
  const children = (evidence.largest_children || []).map(value => `<li>${h(value.name)} · ${h(bytesPlain(value.size_bytes))}</li>`).join("");
  const unknown = evidence.unknown_reason ? `<div class="action-help">仍不确定：${h(evidence.unknown_reason)}</div>` : "";
  return `<div class="detail"><div class="detail-title">证据与置信度 · ${h(confidence)}</div>${sources ? `<ul class="evidence-list">${sources}</ul>` : ""}${children ? `<div class="detail-title">最大直接子项</div><ul class="evidence-list">${children}</ul>` : ""}<div class="action-help">建议：${h(evidence.recommended_owner_action || "只读查看")}</div>${unknown}</div>`;
}

function findingBody(item, tier) {
  const verdict = disposition(item, tier);
  const summary = `<div class="disposal-verdict ${h(verdict.tone)}"><b>${h(verdict.title)}</b><span>${h(verdict.explanation)}</span></div>${detail("归属应用 / 工具", h(ownerName(item, tier)))}${detail("主要作用", h(purposeText(item, tier)))}${detail("判断依据", h(decisionBasis(item, tier)))}`;
  const owner = ownershipPanel(item);
  const project = projectArtifactPanel(item);
  const evidence = evidencePanel(item);
  const protection = protectionPanel(item);
  if (tier === "green") {
    const processes = item.kill_processes && item.kill_processes.length ? item.kill_processes.map(value => `<span class="tag">${h(value)}</span>`).join("") : `<span class="action-help">无需关闭任何进程</span>`;
    const exclusions = item.rule_non_targets && item.rule_non_targets.length
      ? `<ul>${item.rule_non_targets.map(value => `<li>${h(value)}</li>`).join("")}</ul>`
      : `<span class="action-help">未提供</span>`;
    return `${summary}${owner}${detail("规则风险", h(item.rule_risk || "首次使用时可能需要重建缓存。"))}${detail("不在规则范围内", exclusions)}${detail("清理前需关闭", processes)}${detail("可选命令（自行确认后执行）", commandBlocks(item.commands))}${actionPanel(item, tier)}${protection}`;
  }
  if (tier === "yellow") {
    return `${summary}${owner}${evidence}${project}${detail("建议处理方式", h(item.disposal))}${item.risk ? `<div class="risk-note">${h(item.risk)}</div>` : ""}${actionPanel(item, tier)}${protection}`;
  }
  return `${summary}${owner}${evidence}${detail("卸载 / 释放建议", h(item.indirect_release))}${item.auto_reclaim ? detail("是否自动回收", h(item.auto_reclaim)) : ""}${actionPanel(item, tier)}${protection}`;
}

function projectArtifactPanel(item) {
  const project = item.project_artifact;
  const stage = item.stage_status || {};
  if (!project && stage.code) {
    return detail("项目阶段门", `<b>当前不可处理：${h(stage.code)}</b><br>解除条件：完成项目清单、Git checkpoint、ignored/untracked、静置期和打开文件检查后重新扫描。`);
  }
  if (!project) return "";
  const state = stage.state === "ready" ? "阶段门已通过，可进入黄灯人工复核" : `阶段门未通过：${stage.code || "未知原因"}`;
  return detail(
    "项目产物证据",
    `<b>${h(state)}</b><br>构建系统：${h(project.build_system)}<br>生成物：${h(project.artifact_kind)}<br>项目根：${h(project.project_root)}<br>静置门槛：${h(Math.round(project.idle_seconds / 60))} 分钟`
  );
}

function ownershipPanel(item) {
  const owner = item.ownership;
  if (!owner) return "";
  const rows = [
    owner.display_name ? `<b>${h(owner.display_name)}</b>` : "",
    owner.bundle_id ? `Bundle ID：${h(owner.bundle_id)}` : "",
    owner.relationships && owner.relationships.length ? `关系：${owner.relationships.map(h).join("、")}` : "",
    owner.app_paths && owner.app_paths.length ? `应用：${owner.app_paths.map(h).join("、")}` : "",
    owner.login_items && owner.login_items.length ? `登录项：${owner.login_items.map(h).join("、")}` : "",
    owner.background_processes && owner.background_processes.length ? `后台项：${owner.background_processes.map(h).join("、")}` : "",
    owner.multiple_versions ? "检测到多个 App 版本，服务端会阻止处置。" : ""
  ].filter(Boolean);
  return detail("App 归属解析", rows.join("<br>"));
}

function protectionPanel(item) {
  if (!SESSION) return "";
  const owner = item.ownership || {};
  const app = owner.bundle_id || owner.display_name || "";
  return `<div class="detail"><div class="detail-title">永久保护</div><div class="action-row"><button class="action-button secondary protect-value" type="button" data-kind="protected_paths" data-value="${h(item.path)}">保护此路径</button>${app ? `<button class="action-button secondary protect-value" type="button" data-kind="protected_apps" data-value="${h(app)}">保护所属 App</button>` : ""}<span class="action-state">保护只会降权和阻止处置，不会授予删除权限。</span></div></div>`;
}

function installerSection(items) {
  if (!items || !items.length) return "";
  return `<section class="block"><h2 class="block-title">安装包专项视图 <span class="block-count">${items.length} 项</span></h2><div class="installer-grid">${items.map(item => `<article class="installer-item"><h3>${h(item.format)} · ${h(item.name)}</h3><dl><dt>大小</dt><dd>${h(bytesLabel(item.size_bytes).replace(/^\+/, ""))}</dd><dt>安装状态</dt><dd>${h(item.installed_state)}</dd><dt>来源</dt><dd>${h(item.source || "未读取到下载来源")}</dd><dt>最后使用</dt><dd>${h(new Date(item.last_used_at).toLocaleString())}</dd><dt>签名</dt><dd>${h(item.signature_state || "未验证")}</dd><dt>镜像状态</dt><dd>${h(item.mount_state || "不适用")}</dd><dt>唯一副本</dt><dd>${h(item.unique_copy_risk)}</dd><dt>副本证据</dt><dd>${h(item.duplicate_evidence || "需人工确认")}</dd><dt>路径</dt><dd>${h(item.path)}</dd></dl></article>`).join("")}</div></section>`;
}

function detail(label, content) {
  return `<div class="detail"><div class="detail-title">${h(label)}</div><div>${content || ""}</div></div>`;
}

function finding(item, tier) {
  const size = item.size_estimate || item.size || "";
  const verdict = disposition(item, tier);
  const mutation = tier === "green" ? mutationDecision(item, "trash")
    : tier === "yellow" ? mutationDecision(item, "reviewed_trash") : {};
  const expanded = Boolean(SESSION && mutation.allowed);
  return `<article class="finding ${h(tier)}${expanded ? " expanded" : ""}"><button class="finding-toggle" type="button" aria-expanded="${expanded ? "true" : "false"}"><span class="level-dot ${h(tier)}"></span><span class="finding-primary"><span class="finding-title-row"><span class="finding-name">${h(item.name)}</span><span class="finding-status ${h(verdict.tone)}">${h(verdict.short)}</span></span><span class="finding-path-preview">${h(item.path)}</span></span><span class="finding-size">${h(compactSize(size))}</span><span class="finding-arrow">›</span></button><div class="finding-body"><div class="path-line">完整路径：${h(item.path)}</div>${findingBody(item, tier)}</div></article>`;
}

function findingsSection(title, items, tier) {
  items = items || [];
  let selection = "";
  if (tier === "green" && SESSION) {
    const ids = [...new Set(items.flatMap(item => idsFor(item.trash_paths || [], "trash")))];
    if (ids.length) selection = `<button class="action-button secondary select-all" type="button" data-action-ids="${h(ids.join(","))}">全选可清理项</button>`;
  } else if (tier === "yellow" && SESSION) {
    const ids = [...new Set(items.flatMap(item => idsFor(item.reviewed_trash_paths || [], "reviewed_trash")))];
    if (ids.length) selection = `<button class="action-button secondary select-all" type="button" data-action-ids="${h(ids.join(","))}">选择可复核项</button>`;
  }
  const tools = items.length ? `<span class="block-tools"><button class="action-button secondary section-toggle section-expand" type="button" data-expanded="true">展开全部</button><button class="action-button secondary section-toggle section-collapse" type="button" data-expanded="false" disabled>收起全部</button>${selection}</span>` : "";
  const body = items.length ? items.map(item => finding(item, tier)).join("") : `<div class="surface guidance">本次没有${h(tierLabel(tier))}项目。</div>`;
  return `<section class="block findings-section" data-tier="${h(tier)}"><h2 class="block-title">${h(title)} <span class="block-count">${items.length} 项</span>${tools}</h2>${body}</section>`;
}

function fullDetails() {
  const content = findingsSection("绿色 · 可移入废纸篓（确定性、可恢复）", REPORT.green, "green")
    + findingsSection("橙色 · 由你逐项决定（仅授权目标显示按钮）", REPORT.yellow, "yellow")
    + findingsSection("红色 · 不能直接删除（仅定位和说明）", REPORT.red, "red");
  const count = (REPORT.green || []).length + (REPORT.yellow || []).length + (REPORT.red || []).length;
  if (SESSION) return `<section class="interactive-details"><h2 class="block-title">按安全等级处理 <span class="block-count">${h(count)} 项</span></h2>${content}</section>`;
  return `<details class="full-details"><summary>完整明细 · ${h(count)} 项</summary><div class="full-details-content">${content}</div></details>`;
}

function setSectionExpanded(section, expanded) {
  section.querySelectorAll(".finding").forEach(card => {
    card.classList.toggle("expanded", expanded);
    const toggle = card.querySelector(".finding-toggle");
    if (toggle) toggle.setAttribute("aria-expanded", String(expanded));
  });
  updateSectionButtons(section);
}

function updateSectionButtons(section) {
  const cards = [...section.querySelectorAll(".finding")];
  const allExpanded = cards.length > 0 && cards.every(card => card.classList.contains("expanded"));
  const allCollapsed = cards.every(card => !card.classList.contains("expanded"));
  const expand = section.querySelector(".section-expand");
  const collapse = section.querySelector(".section-collapse");
  if (expand) expand.disabled = allExpanded;
  if (collapse) collapse.disabled = allCollapsed;
}

function permissions(paths) {
  if (!paths || !paths.length) return "";
  return `<section class="block permission-note"><b>以下目录权限不足，报告可能遗漏其体量：</b><br>${paths.map(h).join("<br>")}</section>`;
}

function historySection() {
  if (!SESSION) return "";
  return `<section class="block" id="operation-history" hidden><h2 class="block-title">本次操作历史</h2><div class="surface guidance history-list"></div></section>`;
}

function historicalSection() {
  const history = DECISION && DECISION.history || {status: "empty", entries: []};
  const comparison = DECISION && DECISION.comparison;
  const comparisonBlock = comparison ? `<div class="history-entry"><b>最近一次重新扫描对比</b><div class="history-meta">${h(comparison.previous_generated_at)} → ${h(comparison.current_generated_at)} · 总扫描占用变化 ${bytesLabel(comparison.total.delta_bytes || 0)} · 覆盖 ${h(comparison.coverage.previous)} → ${h(comparison.coverage.current)}</div></div>` : "";
  if (history.status === "unavailable") {
    return `<section class="block"><h2 class="block-title">历史操作摘要</h2><div class="surface guidance"><p>历史日志当前不可读取：${h(history.message || "未知原因")}</p></div></section>`;
  }
  const entries = history.entries || [];
  const rows = entries.map(item => {
    const ok = item.status === "completed";
    const delta = item.disk_free_delta_bytes == null ? "" : ` · 磁盘可用空间变化 ${bytesLabel(item.disk_free_delta_bytes)}`;
    const verified = ["trash", "reviewed_trash"].includes(item.mode) ? ` · 原路径复核 ${item.target_exists_after === false ? "已移走" : "未通过"}` : "";
    return `<div class="history-entry ${ok ? "ok" : "error"}"><b>${ok ? "完成" : "失败"} · ${h(item.mode)}</b><div class="history-meta">${h(item.timestamp)}${item.rule_id ? ` · ${h(item.rule_id)}` : ""}${h(delta)}${h(verified)}</div>${item.path ? `<div class="history-path">${h(item.path)}</div>` : ""}${item.error ? `<div class="action-state error">${h(item.error)}</div>` : ""}</div>`;
  }).join("");
  const lead = entries.length
    ? `最近 ${entries.length} 条最终结果 · 完成 ${history.completed || 0} · 失败 ${history.failed || 0} · 磁盘可用空间累计变化 ${bytesLabel(history.disk_delta_bytes || 0)}`
    : "尚无跨会话操作记录。";
  return `<section class="block"><h2 class="block-title">历史操作与扫描对比</h2><div class="surface guidance"><p>${h(lead)}</p><div class="history-list">${comparisonBlock}${rows}</div></div></section>`;
}

function installSessionControls() {
  if (!SESSION || document.getElementById("batch-bar")) return;
  document.body.insertAdjacentHTML("beforeend", `<div class="batch-bar" id="batch-bar" aria-live="polite">
    <div class="batch-summary"><b id="batch-title"></b><span id="batch-detail"></span></div>
    <div class="batch-actions"><button class="action-button secondary" id="batch-clear" type="button">取消选择</button><button class="action-button primary" id="batch-submit" type="button">移入废纸篓</button></div>
  </div>
  <dialog id="confirm-dialog">
    <div class="confirm-head"><h2>确认移入废纸篓</h2><p id="confirm-summary"></p></div>
    <div class="confirm-body"><div id="confirm-policy">服务端将在执行前重新验证整批目标的规则、路径、运行状态、文件身份和父目录。</div><div class="confirm-list" id="confirm-list"></div><label class="review-ack" id="review-ack"><input id="review-ack-input" type="checkbox"><span>我已逐项核对这些黄灯目标，确认它们不是唯一副本、活动项目、应用数据或仍在使用的临时内容。</span></label><div class="batch-progress" id="confirm-progress" aria-live="polite"></div></div>
    <div class="confirm-actions"><button class="action-button secondary" id="confirm-cancel" type="button">取消</button><button class="action-button primary" id="confirm-submit" type="button">确认移入废纸篓</button></div>
  </dialog>`);
  // These controls are created above, so bind their handlers only after the
  // session shell exists. Binding them at script load would abort mount().
  document.getElementById("batch-clear").addEventListener("click", () => setSelected([...SELECTED], false));
  document.getElementById("batch-submit").addEventListener("click", () => openConfirmation([...SELECTED]));
  document.getElementById("confirm-cancel").addEventListener("click", () => document.getElementById("confirm-dialog").close());
  document.getElementById("confirm-submit").addEventListener("click", confirmPending);
  document.getElementById("review-ack-input").addEventListener("change", event => {
    document.getElementById("confirm-submit").disabled = !event.target.checked;
  });
}

function appendHistory(results, fallbackError) {
  if (!SESSION) return;
  const section = document.getElementById("operation-history");
  const list = section && section.querySelector(".history-list");
  if (!section || !list) return;
  const entries = results && results.length ? results : [{
    timestamp: new Date().toISOString(), status: "failed", error: fallbackError || "请求失败", mode: "request", path: ""
  }];
  for (const item of entries) {
    const ok = item.status === "completed";
    const delta = item.disk_free_delta_bytes == null ? "" : ` · 磁盘可用空间变化 ${bytesLabel(item.disk_free_delta_bytes)}`;
    const verified = ["trash", "reviewed_trash"].includes(item.mode) ? ` · 原路径复核 ${item.target_exists_after === false ? "已移走" : "未通过"}` : "";
    list.insertAdjacentHTML("afterbegin", `<div class="history-entry ${ok ? "ok" : "error"}"><b>${ok ? "完成" : "失败"} · ${h(item.mode || "request")}</b><div class="history-meta">${h(item.timestamp || "")}${item.rule_id ? ` · ${h(item.rule_id)}` : ""}${h(delta)}${h(verified)}</div>${item.path ? `<div class="history-path">${h(item.path)}</div>` : ""}${item.error ? `<div class="action-state error">${h(item.error)}</div>` : ""}</div>`);
  }
  section.hidden = false;
}

function updateBatchBar() {
  const actions = selectedActions();
  const bar = document.getElementById("batch-bar");
  if (!bar) return;
  bar.classList.toggle("visible", actions.length > 0);
  if (!actions.length) return;
  const estimate = actions.reduce((sum, action) => {
    const item = reportItemForAction(action);
    return sum + sizeInGb(item.size_estimate || item.size || "");
  }, 0);
  document.getElementById("batch-title").textContent = `已选择 ${actions.length} 项`;
  const reviewed = actions[0] && actions[0].mode === "reviewed_trash";
  document.getElementById("batch-submit").textContent = reviewed ? "进入人工复核" : "移入废纸篓";
  document.getElementById("batch-detail").textContent = estimate > 0
    ? `报告估算约 ${estimate.toFixed(1)} GB，实际释放量以重新扫描为准`
    : "实际释放量以重新扫描为准";
}

function setSelected(ids, checked) {
  if (checked) {
    const incoming = ids.map(id => ACTIONS.get(id)).filter(Boolean);
    const current = selectedActions();
    if (current.length && incoming.length && current[0].mode !== incoming[0].mode) SELECTED.clear();
  }
  for (const id of ids) checked ? SELECTED.add(id) : SELECTED.delete(id);
  document.querySelectorAll(".action-select").forEach(input => {
    const inputIds = input.dataset.actionIds.split(",").filter(Boolean);
    input.checked = inputIds.length > 0 && inputIds.every(id => SELECTED.has(id));
  });
  updateBatchBar();
}

function openConfirmation(ids) {
  const requested = ids.map(id => ACTIONS.get(id)).filter(Boolean);
  if (!requested.length || requested.some(action => action.mode !== requested[0].mode) || !["trash", "reviewed_trash"].includes(requested[0].mode)) return;
  PENDING_ACTIONS = requested;
  if (!PENDING_ACTIONS.length) return;
  const reviewed = PENDING_ACTIONS[0].mode === "reviewed_trash";
  const estimate = PENDING_ACTIONS.reduce((sum, action) => {
    const item = reportItemForAction(action);
    return sum + sizeInGb(item.size_estimate || item.size || "");
  }, 0);
  document.getElementById("confirm-summary").textContent = `${PENDING_ACTIONS.length} 个目标${estimate > 0 ? ` · 报告估算约 ${estimate.toFixed(1)} GB` : ""} · 操作可恢复`;
  document.querySelector("#confirm-dialog h2").textContent = reviewed ? "确认黄灯人工复核" : "确认移入废纸篓";
  document.getElementById("confirm-policy").textContent = reviewed
    ? "服务端将先重新验证整批黄灯目标，再签发与本计划和所选 ID 精确绑定的一次性短时令牌。"
    : "服务端将在执行前重新验证整批目标的规则、路径、运行状态、文件身份和父目录。";
  document.getElementById("confirm-list").innerHTML = PENDING_ACTIONS.map(action => {
    const item = reportItemForAction(action);
    return `<div class="confirm-item" data-confirm-action="${h(action.action_id)}"><b>${h(item.name || action.path)}</b><span>${h(action.path)}</span></div>`;
  }).join("");
  const progress = document.getElementById("confirm-progress");
  progress.textContent = "";
  progress.className = "batch-progress";
  const ack = document.getElementById("review-ack");
  const ackInput = document.getElementById("review-ack-input");
  ack.classList.toggle("visible", reviewed);
  ackInput.checked = false;
  document.getElementById("confirm-submit").textContent = reviewed ? "签发令牌并移入废纸篓" : "确认移入废纸篓";
  document.getElementById("confirm-submit").disabled = reviewed;
  document.getElementById("confirm-cancel").disabled = false;
  document.getElementById("confirm-dialog").showModal();
}

function markCompleted(results) {
  for (const result of (results || [])) {
    if (result.status !== "completed" || !["trash", "reviewed_trash"].includes(result.mode)) continue;
    const input = [...document.querySelectorAll(".action-select")].find(control =>
      control.dataset.actionIds.split(",").filter(Boolean).includes(result.action_id)
    );
    const card = input && input.closest(".finding");
    if (card) card.classList.add("completed");
    document.querySelectorAll(`[data-action-ids]`).forEach(control => {
      const ids = control.dataset.actionIds.split(",").filter(Boolean);
      if (ids.includes(result.action_id)) control.disabled = true;
    });
    SELECTED.delete(result.action_id);
  }
  updateBatchBar();
}

async function postJson(endpoint, payload) {
  const response = await fetch(endpoint, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  let result = {};
  try { result = await response.json(); } catch (_error) { result = {}; }
  if (!response.ok || !result.ok) throw new Error(result.error || `请求失败（${response.status}）`);
  return result;
}

async function executeActions(ids, mode, state, reviewToken = "") {
  if (!ids.length) return;
  if (state) {
    state.textContent = mode === "open" ? `正在${managerName}中打开…` : "正在整批复核并移入废纸篓…";
    state.className = "action-state";
  }
  try {
    const payload = {token: SESSION.token, plan_id: SESSION.plan_id, action_ids: ids};
    if (reviewToken) payload.review_token = reviewToken;
    const result = await postJson(SESSION.endpoint, payload);
    appendHistory(result.results || [], result.error);
    if (["trash", "reviewed_trash"].includes(mode)) {
      const delta = (result.results || []).reduce((sum, item) => sum + Number(item.disk_free_delta_bytes || 0), 0);
      const verified = (result.results || []).every(item => item.target_exists_after === false);
      if (state) state.textContent = verified
        ? `已复核移到废纸篓；磁盘可用空间变化 ${bytesLabel(delta)}，清空废纸篓后才释放内容占用`
        : "操作完成，但缺少原路径复核结果";
      markCompleted(result.results || []);
    } else {
      if (state) state.textContent = `已在${managerName}中打开`;
    }
    if (state) state.className = "action-state ok";
    return result;
  } catch (error) {
    if (!document.querySelector("#operation-history .history-entry")) appendHistory([], error && error.message ? error.message : String(error));
    if (state) {
      state.textContent = `操作失败：${error && error.message ? error.message : error}`;
      state.className = "action-state error";
    }
    throw error;
  }
}

async function confirmPending() {
  const submit = document.getElementById("confirm-submit");
  const progress = document.getElementById("confirm-progress");
  submit.disabled = true;
  document.getElementById("confirm-cancel").disabled = true;
  progress.textContent = "正在整批复核目标，任何一项失效都会在首次副作用前停止…";
  try {
    const ids = PENDING_ACTIONS.map(action => action.action_id);
    const mode = PENDING_ACTIONS[0].mode;
    let reviewToken = "";
    if (mode === "reviewed_trash") {
      const review = await postJson(SESSION.review_endpoint, {token: SESSION.token, plan_id: SESSION.plan_id, action_ids: ids});
      reviewToken = review.review_token;
      progress.textContent = "短时一次性复核令牌已签发，正在执行最终重验…";
    }
    const result = await executeActions(ids, mode, progress, reviewToken);
    progress.textContent = `已完成 ${result.results.length} 项；操作结果已写入本次历史。`;
    window.setTimeout(() => document.getElementById("confirm-dialog").close(), 900);
  } catch (error) {
    progress.textContent = `操作失败：${error && error.message ? error.message : error}`;
    progress.className = "batch-progress error";
    submit.disabled = PENDING_ACTIONS[0] && PENDING_ACTIONS[0].mode === "reviewed_trash" && !document.getElementById("review-ack-input").checked;
    document.getElementById("confirm-cancel").disabled = false;
  }
}

async function rescanReport() {
  const button = document.getElementById("rescan-button");
  if (!button || !SESSION.rescan_endpoint) return;
  button.disabled = true;
  button.textContent = "正在重新扫描…";
  try {
    await postJson(SESSION.rescan_endpoint, {token: SESSION.token, plan_id: SESSION.plan_id});
    window.location.reload();
  } catch (error) {
    button.textContent = `扫描失败：${error && error.message ? error.message : error}`;
    button.disabled = false;
  }
}

function mount() {
  installSessionControls();
  document.getElementById("report-meta").textContent = `生成于 ${REPORT.generated_at || "未知"} · 扫描耗时 ${REPORT.scan_seconds == null ? "未知" : REPORT.scan_seconds + "s"} · ${SESSION ? "受控操作模式" : "静态只读模式"}`;
  const summary = REPORT.summary || {};
  // Keep the three-way decision visible before the longer evidence sections.
  // It is the smallest useful answer for users who will not drill into HTML.
  const interactiveDetails = SESSION ? fullDetails() : "";
  const staticDetails = SESSION ? "" : fullDetails();
  document.getElementById("report-content").innerHTML = decisionSection()
    + sessionSection()
    + interactiveDetails
    + overview(REPORT.system || {}, summary)
    + ownerGroupsSection(REPORT.owner_groups || [])
    + coverageAndApfsSection()
    + workspaceSection()
    + topFive(REPORT.top5)
    + listBlock("执行建议", Array.isArray(summary.priority) ? summary.priority : [], summary.overview)
    + installerSection(REPORT.installer_packages || [])
    + staticDetails
    + permissions(REPORT.denied)
    + historicalSection()
    + historySection()
    + listBlock("长期优化建议", summary.long_term || [], "");
  initializeWorkspace();
}

document.addEventListener("click", event => {
  const browse = event.target.closest("[data-browse-path]");
  if (browse) { browsePath(browse.dataset.browsePath); return; }
  if (event.target.closest("#browser-parent")) { if (BROWSER_STATE.parent) browsePath(BROWSER_STATE.parent); return; }
  if (event.target.closest("#browser-select-all")) {
    document.querySelectorAll(".browser-select").forEach(input => { input.checked = true; BROWSER_STATE.selected.add(input.dataset.path); });
    updateProtectSelection(); return;
  }
  if (event.target.closest("#protect-selected")) {
    const next = {...LOCAL_SETTINGS, protected_paths: [...new Set([...LOCAL_SETTINGS.protected_paths, ...BROWSER_STATE.selected])]};
    saveSettings(next); return;
  }
  const protect = event.target.closest(".protect-value");
  if (protect && LOCAL_SETTINGS) {
    const kind = protect.dataset.kind;
    const next = {...LOCAL_SETTINGS, [kind]: [...new Set([...LOCAL_SETTINGS[kind], protect.dataset.value])]};
    saveSettings(next); return;
  }
  const remove = event.target.closest(".remove-setting");
  if (remove && LOCAL_SETTINGS) {
    const kind = remove.dataset.kind;
    const next = {...LOCAL_SETTINGS, [kind]: LOCAL_SETTINGS[kind].filter(value => value !== remove.dataset.value)};
    saveSettings(next); return;
  }
  if (event.target.closest("#add-scan-root") && LOCAL_SETTINGS) {
    const input = document.getElementById("scan-root-input");
    const value = input.value.trim();
    if (value) saveSettings({...LOCAL_SETTINGS, scan_roots: [...new Set([...LOCAL_SETTINGS.scan_roots, value])]});
    return;
  }
  if (event.target.closest("#add-protected-app") && LOCAL_SETTINGS) {
    const input = document.getElementById("protected-app-input");
    const value = input.value.trim();
    if (value) saveSettings({...LOCAL_SETTINGS, protected_apps: [...new Set([...LOCAL_SETTINGS.protected_apps, value])]});
    return;
  }
  const sectionToggle = event.target.closest(".section-toggle");
  if (sectionToggle) {
    const section = sectionToggle.closest(".findings-section");
    if (section) setSectionExpanded(section, sectionToggle.dataset.expanded === "true");
    return;
  }
  const toggle = event.target.closest(".finding-toggle");
  if (toggle) {
    const card = toggle.closest(".finding");
    const expanded = card.classList.toggle("expanded");
    toggle.setAttribute("aria-expanded", String(expanded));
    const section = card.closest(".findings-section");
    if (section) updateSectionButtons(section);
    return;
  }
  const action = event.target.closest(".action-button");
  if (action && action.dataset.actionIds && action.dataset.mode) {
    const ids = action.dataset.actionIds.split(",").filter(Boolean);
    const panel = action.closest(".action-panel");
    const state = panel && panel.querySelector(".action-state");
    if (action.dataset.mode === "open") executeActions(ids, "open", state).catch(() => {});
    else openConfirmation(ids);
    return;
  }
  const selectAll = event.target.closest(".select-all");
  if (selectAll) { setSelected(selectAll.dataset.actionIds.split(",").filter(Boolean), true); return; }
  const copy = event.target.closest(".copy-command");
  if (copy) {
    event.stopPropagation();
    navigator.clipboard.writeText(decodeURIComponent(copy.dataset.command || "")).then(() => {
      copy.textContent = "已复制";
      copy.classList.add("copied");
      window.setTimeout(() => { copy.textContent = "复制"; copy.classList.remove("copied"); }, 1400);
    });
  }
});

document.addEventListener("change", event => {
  const browserSelect = event.target.closest(".browser-select");
  if (browserSelect) {
    browserSelect.checked ? BROWSER_STATE.selected.add(browserSelect.dataset.path) : BROWSER_STATE.selected.delete(browserSelect.dataset.path);
    updateProtectSelection(); return;
  }
  if (event.target.closest("#browser-sort") || event.target.closest("#browser-min-size")) {
    if (BROWSER_STATE.path) browsePath(BROWSER_STATE.path); return;
  }
  const input = event.target.closest(".action-select");
  if (!input) return;
  setSelected(input.dataset.actionIds.split(",").filter(Boolean), input.checked);
});

document.addEventListener("input", event => {
  if (event.target.id !== "browser-search" || !BROWSER_STATE.path) return;
  window.clearTimeout(BROWSER_STATE.searchTimer);
  BROWSER_STATE.searchTimer = window.setTimeout(() => browsePath(BROWSER_STATE.path), 220);
});

document.addEventListener("click", event => { if (event.target.id === "rescan-button") rescanReport(); });

mount();
</script>
</body>
</html>
